<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Sound Notes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      height: 100vh;
    }
    svg {
      display: block;
      height: 100vh;
      width: auto;
      max-width: 100vw;
    }

    #staff {
      transform: translate(0, 0);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #n1 ellipse, #n1 rect,
    #n2 ellipse, #n2 rect,
    #n3 ellipse, #n3 rect,
    #n4 ellipse, #n4 rect,
    #n5 ellipse, #n5 rect,
    #n6 ellipse, #n6 rect,
    #n7 ellipse, #n7 rect,
    #n8 ellipse, #n8 rect {
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screaming #staff { transform: translate(0, -164px); }

    .screaming #n1 ellipse { cy: 925.43; ry: 34.57; }
    .screaming #n1 rect { y: 760.51; height: 167.37; }

    .screaming #n2 ellipse { cy: 919.08; ry: 35.01; }
    .screaming #n2 rect:first-of-type { y: 752.06; height: 169.5; }
    .screaming #n2 rect:nth-of-type(2) { y: 752.06; height: 169.5; }
    .screaming #n2 rect:last-of-type { y: 719.24; height: 30.06; }

    .screaming #n3 ellipse { cy: 804.95; ry: 36.05; }
    .screaming #n3 rect { y: 632.97; height: 174.54; }

    .screaming #n4 ellipse { cy: 954.1; ry: 40.82; }
    .screaming #n4 rect { y: 759.38; height: 197.61; }

    .screaming #n5 ellipse { cy: 769.56; ry: 38.8; }
    .screaming #n5 rect { y: 584.47; height: 187.83; }

    .screaming #n6 ellipse { cy: 991.69; ry: 45.4; }
    .screaming #n6 rect { y: 775.13; height: 219.78; }

    .screaming #n7 ellipse { cy: 761.5; ry: 49.9; }
    .screaming #n7 rect:first-of-type { y: 523.47; height: 241.57; }
    .screaming #n7 rect:nth-of-type(2) { y: 523.47; height: 241.57; }
    .screaming #n7 rect:last-of-type { y: 476.71; height: 42.84; }

    .screaming #n8 ellipse { cy: 797.5; ry: 44.66; }
    .screaming #n8 rect { y: 584.47; height: 216.19; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    #s1 polygon, #s2 polygon, #s3 polygon, #s4 polygon, #s5 polygon {
      animation: twinkle 1.5s ease-in-out infinite;
      animation-play-state: paused;
    }
    .screaming #s1 polygon { animation-delay: 0s; animation-play-state: running; }
    .screaming #s2 polygon { animation-delay: 0.3s; animation-play-state: running; }
    .screaming #s3 polygon { animation-delay: 0.6s; animation-play-state: running; }
    .screaming #s4 polygon { animation-delay: 0.9s; animation-play-state: running; }
    .screaming #s5 polygon { animation-delay: 1.2s; animation-play-state: running; }

    #error-msg {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      font: 1.2rem/1.4 system-ui, sans-serif;
      padding: 14px 28px;
      border-radius: 8px;
      z-index: 10;
      pointer-events: none;
    }
    #error-msg.hidden { display: none; }
  
.close-btn {
  position: fixed;
  top: 32px;
  left: 32px;
  z-index: 1000;
  display: block;
  align-items: center;
  background: #4700FF;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  color: #fff;
  text-decoration: none;
  transition: background 0.15s ease, color 0.15s ease;
  line-height: 0;
}
.close-btn svg {
  height: 52px;
  width: auto;
  display: block;
}
.close-btn:hover {
  color: #FF00FF;
  background: #4700FF;
}
.close-btn:active {
  color: #fff;
  background: #FF00FF;
}
</style>

<script>
let audioContext = null;
let analyser = null;
let dataArray = null;
let isListening = false;
let isScreaming = false;
let quietStartTime = 0;
let started = false;

const THRESHOLD = 0.25;
const QUIET_DELAY = 300;
const FFT_SIZE = 256;

const errorMsg = document.getElementById('error-msg');

function getRMS() {
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const val = (dataArray[i] / 128) - 1;
    sum += val * val;
  }
  return Math.sqrt(sum / dataArray.length);
}

function listen() {
  if (!isListening) return;
  requestAnimationFrame(listen);
  const rms = getRMS();
  const now = performance.now();
  if (rms >= THRESHOLD) {
    document.body.classList.add('screaming');
    isScreaming = true;
    quietStartTime = now;
  } else if (isScreaming) {
    if (quietStartTime === 0) {
      quietStartTime = now;
    } else if (now - quietStartTime >= QUIET_DELAY) {
      document.body.classList.remove('screaming');
      isScreaming = false;
      quietStartTime = 0;
    }
  } else {
    quietStartTime = 0;
  }
}

async function startAudio() {
  if (started) return;
  started = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);
    isListening = true;
    listen();
  } catch (err) {
    started = false;
    errorMsg.classList.remove('hidden');
    if (err.name === 'NotFoundError') {
      errorMsg.textContent = 'No microphone found';
    } else if (err.name === 'NotAllowedError') {
      errorMsg.textContent = 'Allow mic in browser settings, then click to retry';
    } else {
      errorMsg.textContent = 'Error: ' + err.message;
    }
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    isListening = false;
  } else if (audioContext) {
    isListening = true;
    listen();
  }
});

document.addEventListener('click', startAudio);
</script>
