<script>
const THRESHOLD = 0.04;
const HOLD_TIME = 200;

let audioContext, analyser, dataArray;
let isSoundActive = false;
let silenceTimer = null;

function getVolume() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (const v of dataArray) sum += Math.abs(v - 128);
  return sum / dataArray.length / 128;
}

const STAFF_CY = 576;

function boot() {
  if (audioContext) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const source = ctx.createMediaStreamSource(stream);
    const node = ctx.createAnalyser();
    node.fftSize = 256;
    source.connect(node);
    analyser = node;
    audioContext = ctx;
    dataArray = new Uint8Array(node.frequencyBinCount);
    if (ctx.state === 'suspended') ctx.resume();
    animate();
  }).catch(e => console.error('Mic denied:', e));
}

boot();
document.addEventListener('click', boot);
document.querySelector('svg').addEventListener('click', boot);

const notes = [];
document.querySelectorAll('.note').forEach(el => {
  const circle = el.querySelector('circle');
  const cy = circle ? circle.getAttribute('cy') : STAFF_CY;
  const state = { el, x: 0, y: 0, rot: 0 };
  const dir = cy >= STAFF_CY ? 1 : -1;
  state.p = {
    yDir: dir * (0.5 + Math.random() * 0.5),
    yRange: 250 + Math.random() * 300,
    xRange: 200 + Math.random() * 300,
    rotRange: (Math.random() - 0.5) * 140,
    lerpX: 0.06 + Math.random() * 0.1,
    lerpY: 0.06 + Math.random() * 0.1,
    lerpRot: 0.08 + Math.random() * 0.12,
  };
  notes.push(state);
});

function animateNotes(soundActive) {
  for (const n of notes) {
    const p = n.p;
    if (soundActive) {
      n.x += ((Math.random() - 0.5) * p.xRange - n.x) * p.lerpX;
      n.y += (p.yDir * (p.yRange * 0.3 + Math.random() * p.yRange * 0.7) - n.y) * p.lerpY;
      n.rot += ((Math.random() - 0.5) * p.rotRange - n.rot) * p.lerpRot;
    } else {
      const idle = 0.3;
      n.x += (Math.sin(Date.now() * 0.001 + p.xRange) * idle - n.x) * 0.05;
      n.y += (Math.cos(Date.now() * 0.0012 + p.yRange) * idle - n.y) * 0.05;
      n.rot += (Math.sin(Date.now() * 0.0008 + p.rotRange) * 6 - n.rot) * 0.05;
    }
    n.el.setAttribute('transform', `translate(${n.x}, ${n.y}) rotate(${n.rot})`);
  }
}

function animate() {
  const volume = getVolume();
  if (volume > THRESHOLD) {
    if (!isSoundActive) isSoundActive = true;
    clearTimeout(silenceTimer);
    silenceTimer = null;
  } else if (isSoundActive && !silenceTimer) {
    silenceTimer = setTimeout(() => { isSoundActive = false; }, HOLD_TIME);
  }
  animateNotes(isSoundActive);
  requestAnimationFrame(animate);
}
</script>
