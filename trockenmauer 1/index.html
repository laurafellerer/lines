<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TROCKENMAUER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Piedra&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container"></div>
  <div id="controls">
    <div class="control-group">
      <label>Geschwindigkeit</label>
      <input type="range" id="speed" min="0.5" max="2.5" step="0.1" value="1.5">
      <span id="speed-val">1.5x</span>
    </div>
    <div class="control-group">
      <label>Fall-Schwung</label>
      <input type="range" id="swing" min="0" max="60" step="1" value="15">
      <span id="swing-val">15</span>
    </div>
    <div class="control-group">
      <label>Federung</label>
      <input type="range" id="bounce" min="0" max="100" step="1" value="60">
      <span id="bounce-val">60</span>
    </div>
    <div class="control-group">
      <label>Abstand</label>
      <input type="range" id="stagger" min="100" max="500" step="10" value="260">
      <span id="stagger-val">260ms</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
