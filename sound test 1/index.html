<title>Sound Reactive Notes</title>

<script>
const THRESHOLD = 0.015;
const HOLD_TIME = 200;

let audioContext, analyser, dataArray;
let isSoundActive = false;
let silenceTimer = null;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) {
    console.error('Mic access denied:', e);
  }
}

function getVolume() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (const v of dataArray) sum += v;
  const rms = Math.sqrt(sum / dataArray.length) / 255;
  return rms;
}

initAudio();

const notes = [];
document.querySelectorAll('.note').forEach((el, i) => {
  const state = { el, x: 0, y: 0, rot: 0 };
  // Each note gets a random personality
  state.personality = {
    yDir: (Math.random() - 0.5) * 2,
    yRange: 150 + Math.random() * 250,
    xRange: 120 + Math.random() * 230,
    rotRange: (Math.random() - 0.5) * 100,
    lerpX: 0.04 + Math.random() * 0.08,
    lerpY: 0.04 + Math.random() * 0.08,
    lerpRot: 0.06 + Math.random() * 0.1,
  };
  notes.push(state);
});

function animateNotes(soundActive) {
  for (const n of notes) {
    if (soundActive) {
      const p = n.personality;
      const targetX = (Math.random() - 0.5) * p.xRange;
      const targetY = p.yDir * (p.yRange * 0.3 + Math.random() * p.yRange * 0.7);
      const targetRot = (Math.random() - 0.5) * p.rotRange;
      n.x += (targetX - n.x) * p.lerpX;
      n.y += (targetY - n.y) * p.lerpY;
      n.rot += (targetRot - n.rot) * p.lerpRot;
    } else {
      n.x += (0 - n.x) * 0.08;
      n.y += (0 - n.y) * 0.08;
      n.rot += (0 - n.rot) * 0.08;
    }
    n.el.setAttribute('transform', `translate(${n.x}, ${n.y}) rotate(${n.rot})`);
  }
}

function animate() {
  const volume = getVolume();
  if (volume > THRESHOLD) {
    if (!isSoundActive) {
      isSoundActive = true;
    }
    clearTimeout(silenceTimer);
    silenceTimer = null;
  } else if (isSoundActive && !silenceTimer) {
    silenceTimer = setTimeout(() => {
      isSoundActive = false;
    }, HOLD_TIME);
  }

  animateNotes(isSoundActive);
  requestAnimationFrame(animate);
}

animate();
</script>
